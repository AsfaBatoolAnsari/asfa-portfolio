         before DOMContentLoaded, so the custom elements are registered before React uses them. -->

    <script src="/effects/magic-rings.js" defer></script>
    <script src="/effects/falling-text.js" defer></script>
    <script src="/effects/galaxy.js" defer></script>
    <script src="/effects/grainient.js" defer></script>
    <script src="/effects/light-rays.js" defer></script>
